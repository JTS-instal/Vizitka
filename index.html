<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTS-instal – Vizitka</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #2a2a2a, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #fff;
}

/* karta */
.karta {
  width: 100%;
  max-width: 390px;
  background: rgba(20,20,20,0.85);
  border-radius: 28px;
  padding: 36px 22px 26px;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  overflow: hidden;
}

/* pozadí JTS */
.bg-logo {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 140px;
  font-weight: 800;
  letter-spacing: 6px;
  color: rgba(255,255,255,0.07);
  z-index: 0;
  user-select: none;
  white-space: nowrap;
}

/* obsah */
.obsah {
  position: relative;
  z-index: 1;
  text-align: center;
}

/* jméno */
.jmeno {
  font-size: 26px;
  font-weight: 600;
  margin-top: 80px;
}

.znacka {
  font-size: 16px;
  opacity: 0.7;
  margin-bottom: 28px;
}

/* tlačítka */
.tlacitko {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #fff;
  color: #000;
  padding: 16px;
  margin: 14px 0;
  border-radius: 18px;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
}

/* ikony */
.ikona {
  width: 22px;
  height: 22px;
  stroke: #000;
  stroke-width: 2;
  fill: none;
}

/* popis */
.popis {
  margin-top: 22px;
  font-size: 14px;
  opacity: 0.7;
}

/* IČ / DIČ */
.ico {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.6;
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<div class="karta">
  <div class="bg-logo">JTS</div>

  <div class="obsah">
    <div class="jmeno">Jakub Janda</div>
    <div class="znacka">JTS-instal</div>

    <!-- ULOŽIT KONTAKT -->
    <a href="kontakt.vcf" class="tlacitko">
      <svg class="ikona" viewBox="0 0 24 24">
        <path d="M21 16.92V21a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3 5.18 2 2 0 0 1 5 3h4.09a2 2 0 0 1 2 1.72l.57 4.06a2 2 0 0 1-.57 1.62L9.91 11.09a16 16 0 0 0 3 3l.69-.69a2 2 0 0 1 1.62-.57l4.06.57a2 2 0 0 1 1.72 2z"/>
      </svg>
      Uložit kontakt
    </a>

    <!-- EMAIL -->
    <a href="mailto:jandajakub@jtsinstal.cz" class="tlacitko">
      <svg class="ikona" viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M2 6l10 7 10-7"/>
      </svg>
      Email
    </a>

    <!-- WEB -->
    <a href="https://jts-instal.github.io" class="tlacitko">
      <svg class="ikona" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15 15 0 0 1 0 20"/>
      </svg>
      Web
    </a>

    <!-- INSTAGRAM -->
    <a href="https://www.instagram.com/jts_instal" class="tlacitko">
      <svg class="ikona" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="18" cy="6" r="1"/>
      </svg>
      Instagram
    </a>

    <div class="popis">
      Elektroinstalace – Automatizace – Jádrové vrtání
    </div>

    <div class="ico">
      <div>IČ: 09467801</div>
      <div>DIČ: CZ0104173707</div>
    </div>
  </div>
</div>

</body>
</html>
