<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Jakub Janda – JTS-instal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #111 0%, #000 70%);
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      background: #111;
      border-radius: 24px;
      padding: 32px 24px 28px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    /* LOGO JTS */
    .logo {
      font-size: 96px;
      font-weight: 800;
      letter-spacing: 12px;
      color: #bdbdbd; /* šedý střed */
      opacity: 0.85;
      margin-bottom: 12px;
      text-shadow:
        0 0 18px rgba(255, 204, 0, 0.55),
        0 0 40px rgba(255, 204, 0, 0.35);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 26px;
    }

    h2 {
      margin: 0 0 22px;
      font-size: 18px;
      font-weight: normal;
      color: #f1c40f;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f1c40f;
      color: #000;
      text-decoration: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 6px 0 #caa400;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #caa400;
    }

    .footer {
      margin-top: 18px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">JTS</div>

    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <a class="btn" href="tel:+420727827399">📞 Zavolat</a>
    <a class="btn" href="mailto:jandajakub@jtsinstal.cz">✉️ Email</a>
    <a class="btn" href="https://jts-instal.cz">🌐 Web</a>

    <div class="footer">
      Elektroinstalace – Automatizace – Jádrové vrtání
    </div>
  </div>
</body>
</html>
