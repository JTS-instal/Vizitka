<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakub Janda – JTS-instal</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #1b1b1b, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.card {
  position: relative;
  width: 360px;
  padding: 40px 24px 28px;
  background: rgba(20,20,20,0.9);
  border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.9);
  text-align: center;
  overflow: hidden;
}

/* POZADÍ LOGO JTS */
.card::before {
  content: "JTS";
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 150px;
  font-weight: 800;
  color: rgba(255, 204, 0, 0.25);
  filter: blur(2px);
  z-index: 0;
}

/* OBSAH NAD POZADÍM */
.content {
  position: relative;
  z-index: 1;
}

h1 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 16px;
  color: #f2c200;
  margin-bottom: 28px;
}

/* TLAČÍTKA */
.button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 14px;
  background: #f2c200;
  color: #000;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(242,194,0,0.45);
}

.button i {
  font-size: 20px;
}

/* POPIS */
.desc {
  margin: 18px 0 14px;
  font-size: 12px;       
  color: #bbb;
  white-space: nowrap; 
}

/* IČ / DIČ */
.ids {
  display: flex;
  justify-content: center;
  gap: 16px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="card">
  <div class="content">

    <h1>Jakub Janda</h1>
    <div class="subtitle">JTS-instal</div>

    <a class="button" href="tel:+420XXXXXXXXX">
      <i class="fa-solid fa-phone"></i> Zavolat
    </a>

    <a class="button" href="mailto:info@jts-instal.cz">
      <i class="fa-solid fa-envelope"></i> Email
    </a>

    <a class="button" href="https://jts-instal.github.io">
      <i class="fa-solid fa-globe"></i> Web
    </a>

    <a class="button" href="https://instagram.com/TVUJ_INSTAGRAM">
      <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <div class="desc">
      Elektroinstalace – Automatizace – Jádrové vrtání
    </div>

    <div class="ids">
      <div>IČ: 09467801</div>
      <div>DIČ: CZ0104173707</div>
    </div>

  </div>
</div>

</body>
</html>
