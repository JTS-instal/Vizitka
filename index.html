<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakub Janda – JTS-instal</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1c1c1c,#000);
  color:#fff;
}

/* HLAVNÍ KARTA */
.card{
  position:relative;
  width:100%;
  max-width:380px;
  padding:110px 22px 30px;
  border-radius:30px;
  background:linear-gradient(180deg,#1a1a1a,#0d0d0d);
  box-shadow:0 35px 70px rgba(0,0,0,.8);
  text-align:center;
  overflow:hidden;
}

/* LOGO NA POZADÍ */
.logo-bg{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:150px;
  font-weight:800;
  letter-spacing:10px;
  color:rgba(170,170,170,.25);
  text-shadow:
    0 0 25px rgba(255,200,0,.45),
    0 0 60px rgba(255,200,0,.35);
  pointer-events:none;
  user-select:none;
}

/* JMÉNO */
h1{
  margin:0;
  font-size:26px;
  font-weight:700;
}

/* PODTITUL */
.subtitle{
  margin-top:6px;
  margin-bottom:26px;
  font-size:17px;
  color:#f5c400;
}

/* TLAČÍTKA */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:18px;
  margin-bottom:14px;
  border-radius:20px;
  background:#f5c400;
  color:#000;
  text-decoration:none;
  font-size:18px;
  font-weight:600;
  box-shadow:0 8px 26px rgba(245,196,0,.55);
}

.material-icons-outlined{
  font-size:22px;
}

/* SLUŽBY */
.services{
  margin-top:20px;
  font-size:14px;
  color:#d0d0d0;
}

/* IČ / DIČ */
.company{
  margin-top:12px;
  font-size:14px;
  line-height:1.6;
}

.company a{
  color:#3b6cff;
  text-decoration:none;
  font-weight:600;
}

.company .dic{
  color:#f5c400;
  font-weight:600;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo-bg">JTS</div>

  <h1>Jakub Janda</h1>
  <div class="subtitle">JTS-instal</div>

  <a class="btn" href="tel:+420XXXXXXXXX">
    <span class="material-icons-outlined">call</span>
    Zavolat
  </a>

  <a class="btn" href="mailto:info@jts-instal.cz">
    <span class="material-icons-outlined">mail</span>
    Email
  </a>

  <a class="btn" href="https://jts-instal.github.io" target="_blank">
    <span class="material-icons-outlined">language</span>
    Web
  </a>

  <a class="btn" href="https://instagram.com/tvuj_instagram" target="_blank">
    <span class="material-icons-outlined">photo_camera</span>
    Instagram
  </a>

  <div class="services">
    Elektroinstalace – Automatizace – Jádrové vrtání
  </div>

  <div class="company">
    IČ: <a href="https://wwwinfo.mfcr.cz/cgi-bin/ares/darv_bas.cgi?ico=09467801" target="_blank">09467801</a><br>
    DIČ: <span class="dic">CZ0104173707</span>
  </div>

</div>

</body>
</html>
