<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Jakub Janda – JTS-instal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #1c1c1c 0%, #000 70%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* LOGO JTS – NÍŽ + ŽLUTÝ NÁDECH */
body::before {
    content: "JTS";
    position: fixed;
    top: -2%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 38vw;
    font-weight: 900;
    letter-spacing: 2vw;
    color: rgba(241, 196, 15, 0.08);
    z-index: 0;
    user-select: none;
}

.card {
    background: rgba(20,20,20,0.95);
    border-radius: 22px;
    padding: 26px;
    width: 90%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    z-index: 1;
}

h1 {
    margin: 0;
    font-size: 26px;
}

h2 {
    margin: 6px 0 22px;
    font-weight: normal;
    color: #f1c40f;
    letter-spacing: 1px;
}

.button {
    display: block;
    text-decoration: none;
    background: #f1c40f;
    color: #000;
    padding: 16px;
    border-radius: 18px;
    margin: 14px 0;
    font-size: 18px;
    font-weight: bold;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.button:active {
    transform: scale(0.96);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
}

.footer {
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="card">
    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <a class="button" href="tel:+420727827399">📞 Zavolat</a>
    <a class="button" href="mailto:jandajakub@jtsinstal.cz">✉️ Email</a>
    <a class="button" href="https://jts-instal.cz" target="_blank">🌐 Web</a>

    <div class="footer">
        Elektroinstalace – Automatizace – Jádrové vrtání
    </div>
</div>

</body>
</html>
