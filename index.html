<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakub Janda – JTS-instal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* LOGO NA POZADÍ */
    .watermark {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 150px;
      font-weight: 900;
      letter-spacing: 16px;
      color: rgba(200, 200, 200, 0.22);
      text-shadow:
        0 0 30px rgba(255, 200, 0, 0.45),
        0 0 70px rgba(255, 200, 0, 0.25);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(25, 25, 25, 0.92);
      border-radius: 24px;
      padding: 32px 26px;
      max-width: 360px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h2 {
      margin: 6px 0 24px;
      font-size: 18px;
      color: #f5c400;
      font-weight: normal;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      background: #f5c400;
      color: #000;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(245, 196, 0, 0.45);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      stroke: #000;
      stroke-width: 2;
      fill: none;
    }

    .services {
      margin-top: 18px;
      font-size: 14px;
      color: #bbb;
    }
  </style>
</head>

<body>

  <div class="watermark">JTS</div>

  <div class="card">
    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <!-- ZAVOLAT -->
    <a class="btn" href="tel:+420727827399">
      <svg viewBox="0 0 24 24">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3 5.2 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.7l.5 2.6a2 2 0 0 1-.5 1.7l-1.1 1.1a16 16 0 0 0 6.1 6.1l1.1-1.1a2 2 0 0 1 1.7-.5l2.6.5A2 2 0 0 1 22 16.9z"/>
      </svg>
      Zavolat
    </a>

    <!-- EMAIL -->
    <a class="btn" href="mailto:jandajakub@jtsinstal.cz">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M22 6l-10 7L2 6"/>
      </svg>
      Email
    </a>

    <!-- WEB -->
    <a class="btn" href="https://jts-instal.cz" target="_blank">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15 15 0 0 1 0 20"/>
        <path d="M12 2a15 15 0 0 0 0 20"/>
      </svg>
      Web
    </a>

    <div class="services">
      Elektroinstalace – Automatizace – Jádrové vrtání
    </div>
  </div>

</body>
</html>
