<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jakub Janda – JTS-instal</title>

  <!-- Ikony -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #fff;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 32px 24px 28px;
      border-radius: 28px;
      background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      overflow: hidden;
      text-align: center;
    }

    /* Logo jako pozadí */
    .card::before {
      content: "JTS";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 110px;
      font-weight: 800;
      letter-spacing: 8px;
      color: rgba(180,180,180,0.18);
      text-shadow:
        0 0 25px rgba(255, 200, 0, 0.45),
        0 0 60px rgba(255, 200, 0, 0.25);
      z-index: 0;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 70px 0 4px;
      font-size: 26px;
      font-weight: 700;
    }

    .subtitle {
      color: #f5c400;
      font-size: 17px;
      margin-bottom: 22px;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: #f5c400;
      color: #000;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(245,196,0,0.45);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(245,196,0,0.65);
    }

    .material-icons-outlined {
      font-size: 22px;
    }

    .services {
      margin-top: 18px;
      font-size: 14px;
      color: #cfcfcf;
    }

    .company {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #bdbdbd;
    }

    .company span {
      color: #f5c400;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="content">

      <h1>Jakub Janda</h1>
      <div class="subtitle">JTS-instal</div>

      <a class="btn" href="tel:+420XXXXXXXXX">
        <span class="material-icons-outlined">call</span>
        Zavolat
      </a>

      <a class="btn" href="mailto:info@jts-instal.cz">
        <span class="material-icons-outlined">mail</span>
        Email
      </a>

      <a class="btn" href="https://jts-instal.github.io" target="_blank">
        <span class="material-icons-outlined">language</span>
        Web
      </a>

      <a class="btn" href="https://instagram.com/tvuj_instagram" target="_blank">
        <span class="material-icons-outlined">photo_camera</span>
        Instagram
      </a>

      <div class="services">
        Elektroinstalace – Automatizace – Jádrové vrtání
      </div>

      <div class="company">
        IČ: <span>09467801</span><br>
        DIČ: <span>CZ0104173707</span>
      </div>

    </div>
  </div>

</body>
</html>
