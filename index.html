<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakub Janda – JTS-instal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1b1b1b 0%, #000 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #fff;
}

/* KARTA */
.card {
  position: relative;
  width: 100%;
  max-width: 380px;
  background: rgba(20,20,20,0.92);
  border-radius: 28px;
  padding: 140px 24px 32px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  overflow: hidden;
}

/* LOGO NA POZADÍ */
.card::before {
  content: "JTS";
  position: absolute;
  top: 38px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 140px;
  font-weight: 700;
  color: rgba(255, 204, 0, 0.22);
  text-shadow:
    0 0 30px rgba(255,204,0,0.6),
    0 0 60px rgba(255,204,0,0.35);
  filter: blur(1px);
  pointer-events: none;
  white-space: nowrap;
}

/* TEXTY */
.name {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 4px;
}

.brand {
  font-size: 16px;
  color: #ffcc00;
  margin-bottom: 28px;
}

/* TLAČÍTKA */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 16px;
  margin-bottom: 14px;
  background: #ffcc00;
  color: #000;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(255,204,0,0.35);
  transition: transform 0.15s ease;
}

.btn:hover {
  transform: scale(0.98);
}

.btn i {
  font-size: 18px;
}

/* SPODNÍ TEXT */
.services {
  margin-top: 18px;
  font-size: 14px;
  opacity: 0.8;
}

/* IČ / DIČ – VEDLE SEBE, BEZ BARVY */
.company {
  margin-top: 10px;
  font-size: 14px;
  color: rgba(255,255,255,0.75);
  display: flex;
  justify-content: center;
  gap: 18px;
}
</style>
</head>

<body>

<div class="card">
  <div class="name">Jakub Janda</div>
  <div class="brand">JTS-instal</div>

  <a class="btn" href="tel:+420XXXXXXXXX">
    <i class="fa-solid fa-phone"></i> Zavolat
  </a>

  <a class="btn" href="mailto:info@jts-instal.cz">
    <i class="fa-solid fa-envelope"></i> Email
  </a>

  <a class="btn" href="https://jts-instal.github.io">
    <i class="fa-solid fa-globe"></i> Web
  </a>

  <a class="btn" href="https://instagram.com/jtsinstal">
    <i class="fa-brands fa-instagram"></i> Instagram
  </a>

  <div class="services">
    Elektroinstalace – Automatizace – Jádrové vrtání
  </div>

  <div class="company">
    <span>IČ: 09467801</span>
    <span>DIČ: CZ0104173707</span>
  </div>
</div>

</body>
</html>
