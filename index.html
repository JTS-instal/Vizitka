<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakub Janda – JTS-instal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* LOGO JTS – POZADÍ */
    .watermark {
      position: absolute;
      top: 45%; /* trochu výš */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 150px; /* velikost zůstává */
      font-weight: 900;
      letter-spacing: 16px;
      color: rgba(200, 200, 200, 0.22); /* o trochu čitelnější */
      text-shadow:
        0 0 35px rgba(255, 200, 0, 0.45),
        0 0 80px rgba(255, 200, 0, 0.25);
      pointer-events: none;
      user-select: none;
      z-index: 0;
      white-space: nowrap;
    }

    /* KARTA */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(25, 25, 25, 0.92);
      border-radius: 24px;
      padding: 32px 26px;
      max-width: 360px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    h2 {
      margin: 6px 0 24px;
      font-size: 18px;
      color: #f5c400;
      font-weight: normal;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      background: #f5c400;
      color: #000;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(245, 196, 0, 0.45);
    }

    .services {
      margin-top: 18px;
      font-size: 14px;
      color: #bbb;
    }
  </style>
</head>

<body>

  <!-- LOGO NA POZADÍ -->
  <div class="watermark">JTS</div>

  <!-- VIZITKA -->
  <div class="card">
    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <a class="btn" href="tel:+420727827399">📞 Zavolat</a>
    <a class="btn" href="mailto:jandajakub@jtsinstal.cz">✉️ Email</a>
    <a class="btn" href="https://jts-instal.cz" target="_blank">🌐 Web</a>

    <div class="services">
      Elektroinstalace – Automatizace – Jádrové vrtání
    </div>
  </div>

</body>
</html>
