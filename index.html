<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Jakub Janda – JTS-instal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            font-family:Arial, Helvetica, sans-serif;
            color:#fff;
        }

        .card{
            position:relative;
            background:#111827;
            border-radius:20px;
            padding:32px 26px;
            max-width:380px;
            width:100%;
            box-shadow:0 20px 40px rgba(0,0,0,.5);
            text-align:center;
            overflow:hidden;
        }

        /* LOGO JTS NA POZADÍ */
        .card::before{
            content:"JTS";
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:160px;
            font-weight:900;
            letter-spacing:18px;
            color:rgba(255,200,0,0.07);
            pointer-events:none;
        }

        h1{
            margin:0;
            font-size:28px;
            position:relative;
            z-index:1;
        }

        h2{
            margin:6px 0 28px;
            font-size:18px;
            font-weight:normal;
            color:#facc15;
            position:relative;
            z-index:1;
        }

        .btn{
            display:block;
            text-decoration:none;
            margin:14px 0;
            padding:16px;
            border-radius:16px;
            background:#facc15;
            color:#000;
            font-size:18px;
            font-weight:bold;
            position:relative;
            z-index:1;
        }

        .btn:hover{
            background:#fde047;
        }

        .footer{
            margin-top:24px;
            font-size:14px;
            color:#9ca3af;
            position:relative;
            z-index:1;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <a class="btn" href="tel:+420727827399">📞 Zavolat</a>
    <a class="btn" href="mailto:jandajakub@jtsinstal.cz">✉️ Email</a>
    <a class="btn" href="https://jts-instal.cz" target="_blank">🌐 Web</a>

    <div class="footer">
        Elektroinstalace • Automatizace • Jádrové vrtání
    </div>
</div>

</body>
</html>
