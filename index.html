<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTS-instal | Jakub Janda</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg,#0b0b0b,#1a1a1a);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background: rgba(25,25,25,0.95);
    border-radius:24px;
    padding:32px 26px;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"JTS";
    position:absolute;
    inset:0;
    font-size:120px;
    font-weight:900;
    color:rgba(255,200,0,0.05);
    display:flex;
    justify-content:center;
    align-items:center;
    letter-spacing:12px;
    pointer-events:none;
}

h1{
    margin:0;
    font-size:26px;
    position:relative;
}

h2{
    margin:6px 0 18px;
    font-size:15px;
    font-weight:500;
    color:#ffc800;
    letter-spacing:1px;
    position:relative;
}

a.button{
    display:block;
    margin:12px 0;
    padding:14px;
    background:#ffc800;
    color:#000;
    text-decoration:none;
    font-weight:600;
    border-radius:14px;
    transition:transform .15s, box-shadow .15s;
    position:relative;
}

a.button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(255,200,0,.35);
}

.footer{
    margin-top:18px;
    font-size:12px;
    color:#aaa;
    position:relative;
}
</style>
</head>

<body>
<div class="card">
    <h1>Jakub Janda</h1>
    <h2>JTS-instal</h2>

    <a class="button" href="tel:+420XXXXXXXXX">📞 Zavolat</a>
    <a class="button" href="mailto:info@jts-instal.cz">✉️ Email</a>
    <a class="button" href="https://www.jts-instal.cz">🌐 Web</a>

    <div class="footer">
        Elektroinstalace • Servis • Revize
    </div>
</div>
</body>
</html>
