<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakub Janda – JTS-instal</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #222 0%, #000 60%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

/* karta */
.card {
  position: relative;
  width: 92%;
  max-width: 380px;
  padding: 40px 26px 30px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border-radius: 26px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.9);
  text-align: center;
}

/* pozadí logo */
.bg-logo {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 110px;
  font-weight: 800;
  color: rgba(255,255,255,0.06);
  letter-spacing: 6px;
  user-select: none;
  pointer-events: none;
}

/* texty */
.name {
  font-size: 26px;
  font-weight: 600;
  margin-top: 50px;
}

.brand {
  font-size: 14px;
  letter-spacing: 2px;
  color: #aaa;
  margin-bottom: 26px;
}

/* tlačítka */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 18px;
  background: #fff;
  color: #000;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(255,255,255,0.2);
}

/* popis */
.desc {
  margin-top: 20px;
  font-size: 12px;
  color: #bbb;
  white-space: nowrap;
}

/* ico / dic */
.ids {
  margin-top: 10px;
  font-size: 12px;
  color: #999;
  display: flex;
  justify-content: center;
  gap: 18px;
}
</style>
</head>

<body>

<div class="card">
  <div class="bg-logo">JTS</div>

  <div class="name">Jakub Janda</div>
  <div class="brand">JTS-instal</div>

  <a class="btn" href="tel:+420XXXXXXXXX">Zavolat</a>
  <a class="btn" href="mailto:info@jts-instal.cz">Email</a>
  <a class="btn" href="https://jts-instal.github.io">Web</a>
  <a class="btn" href="https://instagram.com/">Instagram</a>

  <div class="desc">
    Elektroinstalace – Automatizace – Jádrové vrtání
  </div>

  <div class="ids">
    <span>IČ: 09467801</span>
    <span>DIČ: CZ0104173707</span>
  </div>
</div>

</body>
</html>
